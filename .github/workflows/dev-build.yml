name: Dev build

# Every push to develop makes a dev build (docs/BRANCHING_PLAN.md): version <next>-dev.<run>
# (0.0.3-dev.5, from the -SNAPSHOT version in gradle.properties), built and tested, then posted as
# the rolling GitHub pre-release "dev" (tag moved to the commit, jar replaced). It is never marked
# latest, so the newest real release stays the one GitHub shows first.
#
# A newer push cancels a build still building or testing (only the newest commit is worth
# publishing), but never a publish under way: that one finishes, and the newer publish waits.
#
# "[skip dev]" in the last commit message of a push skips the dev build (the Build workflow still
# runs); a skipped push does not cancel a build under way. "[skip ci]" skips every workflow.
on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == '1robie/CraftEngineConverter' && !contains(github.event.head_commit.message, '[skip dev]')
    runs-on: ubuntu-latest
    concurrency:
      group: dev-build-build
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          base=$(grep -oP '^version\s*=\s*\K.+' gradle.properties)
          echo "version=${base%-SNAPSHOT}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pversion="${{ steps.version.outputs.version }}" --console=plain

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: dev-build-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # Tested in the build job; this only assembles the same commit's jar again.
      - name: Plugin jar
        run: ./gradlew :Plugin:shadowJar -Pversion="$VERSION" --console=plain

      - name: GitHub pre-release "dev"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "Plugin/build/libs/CraftEngineConverter-$VERSION.jar" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "CraftEngineConverter dev build ($VERSION)" \
            --notes "Unstable build of \`develop\` at $GITHUB_SHA, replaced on every push. Releases: https://github.com/1robie/CraftEngineConverter/releases"
