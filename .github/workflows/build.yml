name: Build

# Every push and pull request, on any branch. The job name "Build" is a required check of the
# master ruleset (docs/BRANCHING_PLAN.md): renaming it breaks merging into master.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CraftEngineConverter
          path: Plugin/build/libs/CraftEngineConverter-*.jar
