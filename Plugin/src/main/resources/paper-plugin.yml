name: ${project.parent.artifactId}
version: ${plugin.finalVersion}
authors: [ ${plugin.author} ]
description: ${plugin.description}
api-version: ${plugin.apiVersion}
main: ${plugin.mainClass}
bootstrapper: ${plugin.bootstrapper}
loader: ${plugin.loader}
folia-supported: true
dependencies:
  server:
    CraftEngine:
      load: BEFORE
      required: true
      join-classpath: true

    packetevents:
      load: BEFORE
      required: false
      join-classpath: true

    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true