group = fr.robie.craftengineconverter
version = 0.0.2


plugin.author = 1robie
plugin.description = A plugin to convert configurations to CraftEngine format
plugin.apiVersion = 1.21
plugin.mainClass = fr.robie.craftengineconverter.CraftEngineConverter
plugin.bootstrapper = fr.robie.craftengineconverter.CraftEngineConverterBootstrapper
plugin.loader = fr.robie.craftengineconverter.CraftEngineConverterLoader

runServer.jvmArgs = -Xms2G -Xmx2G -Dfile.encoding=UTF-8

# --- HotSwap / DCEVM ------------------------------------------------------------------------------
# Nothing here is bundled - see DEVELOPMENT.md for the three levels of HotSwap.
#
# Level 1 (method bodies) needs none of this: just Debug 'runServer' and press Ctrl+F9.
#
# Level 2 (add/remove methods and fields) needs a JVM with enhanced class redefinition. IntelliJ's
# bundled JetBrains Runtime is one. Point Gradle at it from your *own* user-level properties file -
# never commit a machine path here - by adding to ~/.gradle/gradle.properties (outside the repo):
#   org.gradle.java.installations.paths = <path-to-your-intellij>/jbr
# Then uncomment these three:
# runServer.javaVersion = 25
# runServer.javaVendor  = JetBrains
# runServer.jvmArgs     = -Xms2G -Xmx2G -Dfile.encoding=UTF-8 -XX:+AllowEnhancedClassRedefinition
#
# Level 3 (HotswapAgent) is optional and rarely worth it for a Paper plugin. If you want it, add
# `-XX:HotswapAgent=external` to runServer.jvmArgs above and uncomment these two. `disablePlugin`
# is required: HotswapAgent's Log4j2 plugin cannot instrument Paper's log4j (Paper loads it in a
# separate URLClassLoader) and floods the console with CannotCompileException stack traces.
# runServer.javaAgent     = C:/Users/you/.hotswap/hotswap-agent.jar
# runServer.javaAgentArgs = disablePlugin=Log4j2

####################################################################################################
# Gradle
####################################################################################################
org.gradle.jvmargs = -Xmx3G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true

# Verified on this project against `build` and `runServer`, including the paperweight-userdev
# setup pipeline. Turn it off with `--no-configuration-cache` if a plugin upgrade regresses it.
org.gradle.configuration-cache = true
